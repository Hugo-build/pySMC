[project]
name = "pySMC"
version = "0.1.0"
description = "Probabilistic sampling, cases, and surrogate modeling utilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yuma" }]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.10.7",
  "jax>=0.6.2",
  "optax>=0.2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]


